name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish the skill zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build skill zip
        run: python tools/build_skill.py --out dist --expect-version "${TAG#v}"
      - name: Release notes from CHANGELOG.md
        run: |
          python - "${TAG#v}" > dist/RELEASE_NOTES.md <<'EOF'
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?%s\]?(?![\w.])[^\n]*\n(.*?)(?=^## |\Z)" % re.escape(ver), text, re.M | re.S)
          body = m.group(1).strip() if m else "hwp-reader %s" % ver
          print(body)
          print()
          print("### 첨부 파일")
          print("- `hwp-reader.zip`: Copilot Studio / Microsoft 365 Copilot 에이전트에 업로드하는 스킬 패키지 (zip 루트에 SKILL.md)")
          print("- `hwp-reader.zip.sha256`: SHA-256 체크섬")
          EOF
          cat dist/RELEASE_NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/hwp-reader.zip dist/hwp-reader.zip.sha256 --clobber
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/hwp-reader.zip dist/hwp-reader.zip.sha256 \
              --title "hwp-reader $TAG" --notes-file dist/RELEASE_NOTES.md --verify-tag
          fi
